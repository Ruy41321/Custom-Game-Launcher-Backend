<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Choose a new password</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7; color: #1c2024; padding: 24px;
  }
  main { width: 100%; max-width: 30rem; background: #fff; border-radius: 12px; padding: 32px;
         box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.06); }
  h1 { font-size: 1.35rem; margin: 0 0 .75rem; }
  p { margin: 0 0 1.25rem; }
  label { display: block; font-size: .9rem; font-weight: 600; margin-bottom: .35rem; }
  input { width: 100%; box-sizing: border-box; font: inherit; padding: .6rem .7rem;
          border: 1px solid #c7ccd3; border-radius: 8px; margin-bottom: 1rem;
          background: #fff; color: inherit; }
  button { font: inherit; font-weight: 600; padding: .7rem 1.4rem; border: 0; border-radius: 8px;
           background: #2d5bd7; color: #fff; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  .note { font-size: .9rem; color: #5b6470; margin-bottom: 0; }
  .ok { color: #1a7f43; font-weight: 600; }
  .bad { color: #b3261e; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e6e8ea; }
    main { background: #202329; box-shadow: none; }
    input { background: #16181c; border-color: #3a3f47; }
    .note { color: #9aa3ad; }
    .ok { color: #6fd08c; } .bad { color: #ef8a82; }
  }
</style>
</head>
<body>
<main>
  <h1>Choose a new password</h1>
  <p id="message"></p>
  <div id="form">
    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password">
    <label for="repeat">New password again</label>
    <input id="repeat" type="password" autocomplete="new-password">
    <p><button id="submit" type="button">Change my password</button></p>
  </div>
  <p class="note">Every session signed in with the old password is signed out.</p>
</main>
<script>
  // The one copy of the rule on this page. It is still a *second* copy of
  // domain::MIN_PASSWORD_LENGTH, which nothing here can read — the page is embedded in the
  // binary and /capabilities does not publish the limit — so changing the constant means
  // changing this line, or the page refuses what the API would have accepted.
  var MIN_PASSWORD_LENGTH = 8;

  var token = new URLSearchParams(window.location.search).get('token') || '';
  var password = document.getElementById('password');
  var repeat = document.getElementById('repeat');
  var submit = document.getElementById('submit');
  var message = document.getElementById('message');

  password.minLength = MIN_PASSWORD_LENGTH;
  repeat.minLength = MIN_PASSWORD_LENGTH;

  function say(text, className) {
    message.textContent = text;
    message.className = className || '';
  }

  say('At least ' + MIN_PASSWORD_LENGTH + ' characters. Length is what is asked for; nothing else is.');

  if (!token) {
    submit.disabled = true;
    say('This link is missing its token. Open the link from the message exactly as it arrived.', 'bad');
  }

  submit.addEventListener('click', function () {
    // Checked here so a typo costs a keystroke instead of the single-use link: the server sees
    // one password and cannot tell a mistyped one from a chosen one.
    if (password.value !== repeat.value) {
      say('The two passwords are not the same.', 'bad');
      return;
    }
    if (password.value.length < MIN_PASSWORD_LENGTH) {
      say('The password must be at least ' + MIN_PASSWORD_LENGTH + ' characters.', 'bad');
      return;
    }

    submit.disabled = true;
    say('Changing…');

    fetch('/api/v1/auth/password-reset/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, password: password.value })
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (body) {
        if (response.ok) {
          document.getElementById('form').remove();
          say('Your password is changed. Sign in from the launcher with the new one.', 'ok');
          return;
        }
        submit.disabled = false;
        say(body.detail || 'This link is invalid or has expired. Ask for another one.', 'bad');
      });
    }).catch(function () {
      submit.disabled = false;
      say('The server could not be reached. Try again in a moment.', 'bad');
    });
  });
</script>
</body>
</html>
